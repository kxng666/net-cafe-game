<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Thành Phố Sợi Chỉ</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:"Courier New",monospace;
    background:#090d20;
    color:white;
    overflow-x:hidden;
}


/* ==============================
   GAME BACKGROUND
============================== */

.game-page{
    position:relative;
    width:100%;
    min-height:100svh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px 12px;

    background:
        linear-gradient(
            180deg,
            #111737 0%,
            #111631 55%,
            #080b1b 100%
        );

    overflow:hidden;
}


/* ==============================
   STARS
============================== */

.stars{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.star{
    position:absolute;
    color:#bfc5e6;
    font-size:12px;
    opacity:.6;
}

.star:nth-child(1){
    left:9%;
    top:13%;
}

.star:nth-child(2){
    left:23%;
    top:28%;
}

.star:nth-child(3){
    right:14%;
    top:18%;
}

.star:nth-child(4){
    right:29%;
    top:35%;
}

.star:nth-child(5){
    left:16%;
    bottom:22%;
}

.star:nth-child(6){
    right:10%;
    bottom:27%;
}


/* ==============================
   CITY
============================== */

.city{
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    height:115px;

    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:5px;

    opacity:.55;
}

.building{
    position:relative;
    width:35px;

    background:#0d1129;

    border-top:3px solid #181e40;
}

.building::after{
    content:"";

    position:absolute;

    left:8px;
    right:8px;
    top:12px;

    height:6px;

    background:#b68a27;

    box-shadow:
        0 17px 0 #b68a27,
        0 34px 0 #b68a27,
        0 51px 0 #b68a27;
}

.building:nth-child(1){
    height:55px;
}

.building:nth-child(2){
    height:85px;
}

.building:nth-child(3){
    height:65px;
}

.building:nth-child(4){
    height:120px;
}

.building:nth-child(5){
    height:75px;
}

.building:nth-child(6){
    height:105px;
}

.building:nth-child(7){
    height:65px;
}

.building:nth-child(8){
    height:90px;
}

.building:nth-child(9){
    height:55px;
}


/* ==============================
   LOGIN CARD
============================== */

.login-card{
    position:relative;
    z-index:10;

    width:min(430px,100%);

    background:#171b38;

    border:4px solid #4a5185;

    box-shadow:
        8px 8px 0 #050711,
        0 0 0 4px #090b18;

    padding:18px 20px 20px;
}


/* ==============================
   LOGO
============================== */

.logo-container{
    width:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100px;
}

.game-logo{
    display:block;

    width:min(300px,90%);

    max-height:130px;

    object-fit:contain;
}


/* Nếu chưa có logo.png */

.logo-fallback{
    text-align:center;
    line-height:1;

    display:none;
}

.logo-fallback .top{
    font-size:29px;
    color:white;

    text-shadow:
        4px 4px 0 #3153a1;
}

.logo-fallback .bottom{
    margin-top:7px;

    font-size:32px;

    color:#f1aa2d;

    text-shadow:
        4px 4px 0 #71410f;
}


/* ==============================
   SUBTITLE
============================== */

.subtitle{
    text-align:center;

    color:#f0b238;

    font-size:10px;

    letter-spacing:3px;

    margin:4px 0 15px;
}


/* ==============================
   TABS
============================== */

.tabs{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:6px;

    margin-bottom:15px;
}

.tab{
    height:45px;

    border:3px solid #070912;

    background:#292e51;

    color:#aeb4d3;

    font-family:inherit;

    font-size:12px;

    font-weight:bold;

    box-shadow:3px 3px 0 #05060e;
}

.tab.active{
    background:#e7a128;

    color:#171426;

    border-color:#ffd66d;
}


/* ==============================
   LABEL
============================== */

.field-label{
    display:block;

    margin:11px 0 5px;

    color:#d3d7ed;

    font-size:11px;

    font-weight:bold;

    letter-spacing:1px;
}


/* ==============================
   INPUT
============================== */

.input{
    width:100%;

    height:47px;

    padding:9px 11px;

    border:3px solid #555d8b;

    border-radius:0;

    background:#0b0f25;

    color:white;

    font-family:inherit;

    font-size:14px;

    outline:none;
}

.input:focus{
    border-color:#f1aa2d;
}


/* ==============================
   PASSWORD
============================== */

.password-wrapper{
    position:relative;
}

.password-wrapper .input{
    padding-right:50px;
}

.show-password{
    position:absolute;

    right:5px;
    top:4px;

    width:38px;
    height:38px;

    border:0;

    background:#292e51;

    color:#f1c35b;

    font-size:16px;
}


/* ==============================
   REGISTER
============================== */

.register-only{
    display:none;
}

.register-mode .register-only{
    display:block;
}


/* ==============================
   REMEMBER
============================== */

.remember{
    display:flex;

    align-items:center;

    gap:8px;

    margin-top:11px;

    color:#9da4c7;

    font-size:10px;
}

.remember input{
    width:17px;
    height:17px;

    margin:0;

    accent-color:#e7a128;
}


/* ==============================
   MAIN BUTTON
============================== */

.main-button{
    width:100%;

    min-height:50px;

    margin-top:15px;

    border:3px solid #ffe08a;

    background:#e7a128;

    color:#171426;

    font-family:inherit;

    font-size:12px;

    font-weight:bold;

    box-shadow:4px 4px 0 #060711;
}

.main-button:active{
    transform:translate(2px,2px);

    box-shadow:2px 2px 0 #060711;
}


/* ==============================
   MESSAGE
============================== */

.message{
    display:none;

    margin-top:10px;

    padding:8px;

    border:2px solid #77505a;

    background:#291923;

    color:#ffbdc8;

    text-align:center;

    font-size:10px;
}


/* ==============================
   FOOTER
============================== */

.footer{
    text-align:center;

    color:#777fa7;

    font-size:9px;

    line-height:1.6;

    margin-top:14px;
}


/* ==============================
   MOBILE
============================== */

@media(max-width:600px){

    .game-page{

        min-height:100svh;

        padding:
            18px
            10px
            135px;

        align-items:flex-start;
    }

    .login-card{

        margin-top:
            max(
                25px,
                env(safe-area-inset-top)
            );

        width:100%;

        max-width:430px;

        padding:
            13px
            14px
            16px;

        border-width:3px;

        box-shadow:
            6px 6px 0 #050711,
            0 0 0 3px #090b18;
    }

    .logo-container{
        min-height:80px;
    }

    .game-logo{
        width:260px;
        max-height:105px;
    }

    .logo-fallback .top{
        font-size:25px;
    }

    .logo-fallback .bottom{
        font-size:28px;
    }

    .subtitle{
        font-size:8px;
        margin-bottom:12px;
    }

    .tab{
        height:43px;
        font-size:11px;
    }

    .field-label{
        font-size:10px;
        margin-top:9px;
    }

    .input{
        height:46px;
        font-size:15px;
    }

    .main-button{
        min-height:50px;
        font-size:11px;
    }

    .city{
        height:100px;
    }
}


/* ==============================
   VERY SMALL PHONE
============================== */

@media(max-width:360px){

    .game-page{
        padding-left:7px;
        padding-right:7px;
    }

    .login-card{
        padding-left:11px;
        padding-right:11px;
    }

    .game-logo{
        width:230px;
    }

    .tab{
        font-size:10px;
    }

    .main-button{
        font-size:10px;
    }
}

</style>
</head>


<body>

<div class="game-page">


    <!-- STARS -->

    <div class="stars">

        <span class="star">✦</span>
        <span class="star">✦</span>
        <span class="star">✦</span>
        <span class="star">✦</span>
        <span class="star">✦</span>
        <span class="star">✦</span>

    </div>


    <!-- CITY -->

    <div class="city">

        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>

    </div>


    <!-- LOGIN -->

    <section
        class="login-card"
        id="loginCard"
    >


        <!-- LOGO -->

        <div class="logo-container">

            <img
                src="logo.png"
                class="game-logo"
                alt="Thành Phố Sợi Chỉ"
                onerror="
                    this.style.display='none';
                    document.getElementById('logoFallback').style.display='block';
                "
            >

            <div
                id="logoFallback"
                class="logo-fallback"
            >

                <div class="top">
                    THÀNH PHỐ
                </div>

                <div class="bottom">
                    SỢI CHỈ
                </div>

            </div>

        </div>


        <div class="subtitle">
            ✦ ONLINE WORLD ✦
        </div>


        <!-- TABS -->

        <div class="tabs">

            <button
                type="button"
                id="loginTab"
                class="tab active"
            >
                ĐĂNG NHẬP
            </button>

            <button
                type="button"
                id="registerTab"
                class="tab"
            >
                ĐĂNG KÝ
            </button>

        </div>


        <!-- FORM -->

        <form id="accountForm">


            <label
                class="field-label"
                for="username"
            >
                TÊN TÀI KHOẢN
            </label>

            <input
                class="input"
                id="username"
                type="text"
                placeholder="Nhập tên tài khoản..."
                maxlength="20"
                autocomplete="username"
                required
            >


            <label
                class="field-label"
                for="password"
            >
                MẬT KHẨU
            </label>


            <div class="password-wrapper">

                <input
                    class="input"
                    id="password"
                    type="password"
                    placeholder="Nhập mật khẩu..."
                    minlength="6"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    id="showPassword"
                >
                    👁
                </button>

            </div>


            <!-- REGISTER -->

            <div class="register-only">

                <label
                    class="field-label"
                    for="confirmPassword"
                >
                    NHẬP LẠI MẬT KHẨU
                </label>

                <input
                    class="input"
                    id="confirmPassword"
                    type="password"
                    placeholder="Nhập lại mật khẩu..."
                    minlength="6"
                >

            </div>


            <!-- REMEMBER -->

            <label class="remember">

                <input
                    type="checkbox"
                    id="remember"
                >

                <span>
                    Ghi nhớ tài khoản trên thiết bị này
                </span>

            </label>


            <!-- MESSAGE -->

            <div
                class="message"
                id="message"
            ></div>


            <!-- BUTTON -->

            <button
                type="submit"
                class="main-button"
                id="submitButton"
            >
                ▶ ĐĂNG NHẬP VÀO THÀNH PHỐ
            </button>


        </form>


        <div class="footer">

            THÀNH PHỐ SỢI CHỈ © 2026

            <br>

            PIXEL ONLINE ROLEPLAY

        </div>


    </section>

</div>


<script>

const loginCard =
    document.getElementById("loginCard");

const loginTab =
    document.getElementById("loginTab");

const registerTab =
    document.getElementById("registerTab");

const form =
    document.getElementById("accountForm");

const password =
    document.getElementById("password");

const confirmPassword =
    document.getElementById("confirmPassword");

const showPassword =
    document.getElementById("showPassword");

const submitButton =
    document.getElementById("submitButton");

const message =
    document.getElementById("message");

let registerMode = false;


/* LOGIN */

loginTab.onclick = function(){

    registerMode = false;

    loginCard.classList.remove(
        "register-mode"
    );

    loginTab.classList.add("active");

    registerTab.classList.remove("active");

    confirmPassword.required = false;

    submitButton.textContent =
        "▶ ĐĂNG NHẬP VÀO THÀNH PHỐ";

    message.style.display = "none";
};


/* REGISTER */

registerTab.onclick = function(){

    registerMode = true;

    loginCard.classList.add(
        "register-mode"
    );

    loginTab.classList.remove("active");

    registerTab.classList.add("active");

    confirmPassword.required = true;

    submitButton.textContent =
        "▶ TẠO TÀI KHOẢN";

    message.style.display = "none";
};


/* PASSWORD */

showPassword.onclick = function(){

    if(password.type === "password"){

        password.type = "text";

        showPassword.textContent = "🙈";

    }else{

        password.type = "password";

        showPassword.textContent = "👁";

    }

};


/* FORM */

form.onsubmit = function(event){

    event.preventDefault();

    message.style.display = "none";


    if(
        document.getElementById("username")
        .value
        .trim()
        .length < 3
    ){

        message.textContent =
            "Tên tài khoản phải có ít nhất 3 ký tự.";

        message.style.display = "block";

        return;
    }


    if(password.value.length < 6){

        message.textContent =
            "Mật khẩu phải có ít nhất 6 ký tự.";

        message.style.display = "block";

        return;
    }


    if(registerMode){

        if(
            password.value !==
            confirmPassword.value
        ){

            message.textContent =
                "Mật khẩu nhập lại không giống nhau.";

            message.style.display = "block";

            return;
        }

        message.textContent =
            "✓ UI đăng ký hoạt động — chưa kết nối máy chủ.";

    }else{

        message.textContent =
            "✓ UI đăng nhập hoạt động — chưa kết nối máy chủ.";
    }


    message.style.display = "block";

};

</script>

</body>
</html>
