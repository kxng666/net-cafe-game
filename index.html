<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Thành Phố Sợi Chỉ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">

        <!-- LOGIN CARD -->
        <section class="login-card">

            <!-- LOGO -->
            <div class="logo-area">
                <img
                    src="logo.png"
                    alt="Thành Phố Sợi Chỉ"
                    class="game-logo"
                >
            </div>

            <div class="subtitle">
                ✦ ONLINE WORLD ✦
            </div>

            <!-- TAB -->
            <div class="tabs">

                <button
                    type="button"
                    id="loginTab"
                    class="tab active"
                >
                    ĐĂNG NHẬP
                </button>

                <button
                    type="button"
                    id="registerTab"
                    class="tab"
                >
                    ĐĂNG KÝ
                </button>

            </div>

            <!-- FORM -->
            <form id="accountForm">

                <!-- USERNAME -->
                <label for="username">
                    TÊN TÀI KHOẢN
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Nhập tên tài khoản..."
                    maxlength="20"
                    autocomplete="username"
                    required
                >

                <!-- PASSWORD -->
                <label for="password">
                    MẬT KHẨU
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Nhập mật khẩu..."
                        minlength="6"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="showPassword"
                        class="password-button"
                    >
                        👁
                    </button>

                </div>

                <!-- CONFIRM PASSWORD -->
                <div
                    id="confirmPasswordBox"
                    class="hidden"
                >

                    <label for="confirmPassword">
                        NHẬP LẠI MẬT KHẨU
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Nhập lại mật khẩu..."
                        minlength="6"
                        autocomplete="new-password"
                    >

                </div>

                <!-- REMEMBER -->
                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    <span>
                        Ghi nhớ tài khoản trên thiết bị này
                    </span>

                </label>

                <!-- SUBMIT -->
                <button
                    type="submit"
                    id="submitButton"
                    class="main-button"
                >
                    ▶ ĐĂNG NHẬP VÀO THÀNH PHỐ
                </button>

            </form>

            <div class="footer">
                THÀNH PHỐ SỢI CHỈ © 2026
                <br>
                PIXEL ONLINE ROLEPLAY
            </div>

        </section>

    </main>


    <script>

        const loginTab =
            document.getElementById("loginTab");

        const registerTab =
            document.getElementById("registerTab");

        const confirmBox =
            document.getElementById("confirmPasswordBox");

        const confirmPassword =
            document.getElementById("confirmPassword");

        const submitButton =
            document.getElementById("submitButton");

        const password =
            document.getElementById("password");

        const showPassword =
            document.getElementById("showPassword");

        const form =
            document.getElementById("accountForm");


        let registerMode = false;


        /*
        ========================================
        CHUYỂN ĐĂNG NHẬP / ĐĂNG KÝ
        ========================================
        */

        function changeMode(register) {

            registerMode = register;

            loginTab.classList.toggle(
                "active",
                !register
            );

            registerTab.classList.toggle(
                "active",
                register
            );


            if (register) {

                confirmBox.classList.remove("hidden");

                confirmPassword.required = true;

                submitButton.textContent =
                    "▶ TẠO TÀI KHOẢN";

            } else {

                confirmBox.classList.add("hidden");

                confirmPassword.required = false;

                submitButton.textContent =
                    "▶ ĐĂNG NHẬP VÀO THÀNH PHỐ";

            }

        }


        loginTab.addEventListener(
            "click",
            () => changeMode(false)
        );


        registerTab.addEventListener(
            "click",
            () => changeMode(true)
        );


        /*
        ========================================
        HIỆN / ẨN MẬT KHẨU
        ========================================
        */

        showPassword.addEventListener(
            "click",
            () => {

                if (password.type === "password") {

                    password.type = "text";

                    showPassword.textContent = "🙈";

                } else {

                    password.type = "password";

                    showPassword.textContent = "👁";

                }

            }
        );


        /*
        ========================================
        FORM
        ========================================
        */

        form.addEventListener(
            "submit",
            (event) => {

                event.preventDefault();


                if (registerMode) {

                    if (
                        password.value !==
                        confirmPassword.value
                    ) {

                        alert(
                            "Mật khẩu nhập lại không giống nhau!"
                        );

                        return;

                    }


                    alert(
                        "UI đăng ký hoạt động!\n\n" +
                        "Bước tiếp theo sẽ kết nối MySQL."
                    );

                } else {

                    alert(
                        "UI đăng nhập hoạt động!\n\n" +
                        "Bước tiếp theo sẽ kết nối server."
                    );

                }

            }
        );

    </script>

</body>
</html>
